# Unit tests run per lambda / transformation / glue job, only when that code (or shared
# test infra) changes. Warehouse-backed tests run against the Redshift STAGING warehouse
# (assumed to always hold a small amount of data) from a self-hosted runner inside the VPC
# (terraform/vpc.tf); the warehouse is not reachable from the internet. Connection details
# come from repository variables REDSHIFT_HOST / REDSHIFT_USER / REDSHIFT_PASSWORD.
# Pushes to main run everything, and terraform is validated on every infra change.
# Terraform plan/apply use the S3 state backend (see terraform/providers.tf) and need repository
# variables AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (secured) and AWS_DEFAULT_REGION.
# Branches get a read-only plan; main applies the saved plan, then re-plans and fails unless
# the second plan is empty (deployment idempotency: applying the same code twice changes nothing).
image: python:3.12

definitions:
  caches:
    pip: ~/.cache/pip
  steps:
    - step: &terraform-validate
        name: Terraform fmt + validate
        image: hashicorp/terraform:1.10
        script:
          - cd terraform
          - terraform fmt -check -recursive
          - terraform init -backend=false -input=false
          - terraform validate
    - step: &terraform-plan
        name: Terraform plan (read-only)
        image: hashicorp/terraform:1.10
        script:
          - cd terraform
          - terraform init -input=false
          - terraform plan -input=false -lock-timeout=5m
    - step: &terraform-apply
        name: Terraform apply + idempotence check
        image: hashicorp/terraform:1.10
        deployment: production
        script:
          - cd terraform
          - terraform init -input=false
          - terraform plan -input=false -lock-timeout=5m -out=tfplan
          - terraform apply -input=false -lock-timeout=5m tfplan
          # A second plan right after apply must be empty: exit 0 = no changes, 2 = drift, 1 = error.
          - |
            set +e
            terraform plan -input=false -lock-timeout=5m -detailed-exitcode
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "Not idempotent: a plan straight after apply reported changes or errors (exit $rc)." >&2
              exit 1
            fi
            echo "Idempotent: second plan is empty."
    - step: &test-sftp_ingest
        name: Test lambda sftp_ingest
        runs-on: [self.hosted, linux, vpc]
        caches: [pip]
        artifacts: [test-results/**]
        script:
          - ci/run_tests.sh sftp_ingest
    - step: &test-authorizer
        name: Test lambda authorizer
        runs-on: [self.hosted, linux, vpc]
        caches: [pip]
        artifacts: [test-results/**]
        script:
          - ci/run_tests.sh authorizer
    - step: &test-customerA_billing
        name: Test endpoint customerA_billing
        runs-on: [self.hosted, linux, vpc]
        caches: [pip]
        artifacts: [test-results/**]
        script:
          - ci/run_tests.sh customerA_billing
    - step: &test-customerB_billing
        name: Test endpoint customerB_billing
        runs-on: [self.hosted, linux, vpc]
        caches: [pip]
        artifacts: [test-results/**]
        script:
          - ci/run_tests.sh customerB_billing
    - step: &test-customerA_user_transactions
        name: Test endpoint customerA_user_transactions
        runs-on: [self.hosted, linux, vpc]
        caches: [pip]
        artifacts: [test-results/**]
        script:
          - ci/run_tests.sh customerA_user_transactions
    - step: &test-transformation_a
        name: Test transformation_a
        runs-on: [self.hosted, linux, vpc]
        caches: [pip]
        artifacts: [test-results/**]
        script:
          - ci/run_tests.sh transformation_a
    - step: &test-transformation_b
        name: Test transformation_b
        runs-on: [self.hosted, linux, vpc]
        caches: [pip]
        artifacts: [test-results/**]
        script:
          - ci/run_tests.sh transformation_b
    - step: &test-glue_migrate_data
        name: Test glue migrate_data
        runs-on: [self.hosted, linux, vpc]
        caches: [pip]
        artifacts: [test-results/**]
        script:
          - ci/run_tests.sh glue_migrate_data

pipelines:
  default:
    - parallel:
        - step:
            <<: *terraform-validate
            condition:
              changesets:
                includePaths: [terraform/**, bitbucket-pipelines.yml]
        - step:
            <<: *terraform-plan
            condition:
              changesets:
                includePaths: [terraform/**, glue_jobs/**, ingestion/**, auth/**, api_business_logic/**, transformations/**, bitbucket-pipelines.yml]
        - step:
            <<: *test-sftp_ingest
            condition:
              changesets:
                includePaths: [ingestion/sftp_ingest.py, tests/sftp_ingest/**, tests/conftest.py, requirements-dev.txt, ci/**, bitbucket-pipelines.yml]
        - step:
            <<: *test-authorizer
            condition:
              changesets:
                includePaths: [auth/authorizer.py, tests/authorizer/**, tests/conftest.py, requirements-dev.txt, ci/**, bitbucket-pipelines.yml]
        - step:
            <<: *test-customerA_billing
            condition:
              changesets:
                includePaths: [api_business_logic/customerA_billing.py, api_business_logic/_*.py, tests/customerA_billing/**, tests/conftest.py, requirements-dev.txt, ci/**, bitbucket-pipelines.yml]
        - step:
            <<: *test-customerB_billing
            condition:
              changesets:
                includePaths: [api_business_logic/customerB_billing.py, api_business_logic/_*.py, tests/customerB_billing/**, tests/conftest.py, requirements-dev.txt, ci/**, bitbucket-pipelines.yml]
        - step:
            <<: *test-customerA_user_transactions
            condition:
              changesets:
                includePaths: [api_business_logic/customerA_user_transactions.py, api_business_logic/_*.py, tests/customerA_user_transactions/**, tests/conftest.py, requirements-dev.txt, ci/**, bitbucket-pipelines.yml]
        - step:
            <<: *test-transformation_a
            condition:
              changesets:
                includePaths: [transformations/transformation_a.py, transformations/_*.py, tests/transformation_a/**, tests/conftest.py, requirements-dev.txt, ci/**, bitbucket-pipelines.yml]
        - step:
            <<: *test-transformation_b
            condition:
              changesets:
                includePaths: [transformations/transformation_b.py, transformations/_*.py, tests/transformation_b/**, tests/conftest.py, requirements-dev.txt, ci/**, bitbucket-pipelines.yml]
        - step:
            <<: *test-glue_migrate_data
            condition:
              changesets:
                includePaths: [glue_jobs/migrate_data.py, tests/glue_migrate_data/**, tests/conftest.py, requirements-dev.txt, ci/**, bitbucket-pipelines.yml]

  branches:
    main:
      - parallel:
          - step: *terraform-validate
          - step: *test-sftp_ingest
          - step: *test-authorizer
          - step: *test-customerA_billing
          - step: *test-customerB_billing
          - step: *test-customerA_user_transactions
          - step: *test-transformation_a
          - step: *test-transformation_b
          - step: *test-glue_migrate_data
      - step: *terraform-apply
